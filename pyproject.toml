[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cinemashelf"
version = "0.1.0"
description = "Local-first personal movie library, watch state tracker, and smart download manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "httpx[socks]>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]
browser = [
    "DrissionPage>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
